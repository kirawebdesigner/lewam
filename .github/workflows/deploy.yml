name: Deploy LEWAM to DirectAdmin

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy static site
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: lv-shared02.dapanel.net
          username: ${{ secrets.DA_FTP_USERNAME }}
          password: ${{ secrets.DA_FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./
          server-dir: /domains/lewam.pro.et/public_html/
          exclude: |
            **/.git*/**
            **/.github/**
            **/node_modules/**
